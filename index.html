    <!-- Immediate OS-level or solar dark/light mode preference detection on initial load -->
    <script>
      (function() {
        try {
          var storageKey = 'haevy_theme_mode';
          var saved = localStorage.getItem(storageKey);
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          
          var effective = 'dark';
          if (saved === 'dark' || saved === 'light') {
            effective = saved;
          } else if (saved === 'system') {
            effective = prefersDark ? 'dark' : 'light';
          } else {
            // Default or 'solar' mode: estimate from local clock (06:00 to 18:30 is light, else dark)
            var hour = new Date().getHours() + new Date().getMinutes() / 60;
            effective = (hour >= 6 && hour < 18.5) ? 'light' : 'dark';
          }

          var root = document.documentElement;
          if (effective === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', effective === 'dark' ? '#09090b' : '#f1f5f9');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
